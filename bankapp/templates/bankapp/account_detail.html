{% extends 'bankapp/base.html' %}
{% block title %}Your account{% endblock %}
{% block content %}
    <h1>{{ account.first_name }} {{ account.last_name }}</h1>
    <dl>
        <dt>Address</dt><dd>{{ account.address }}</dd>
        <dt>Passport ID</dt><dd>{{ account.passport_id }}</dd>
        <dt>Balance</dt><dd>{{ account.balance }}</dd>
    </dl>
    <p><a href="{% url 'account-update' %}">Edit account details</a></p>
    <p><a href="{% url 'card-create' %}">Create a card</a></p>
{% endblock %}
