{% extends 'bankapp/base.html' %}
{% block title %}Your account{% endblock %}
{% block content %}
    <div class="account-detail">
        <h1>{{ account.first_name }} {{ account.last_name }}</h1>
        
        <div class="account-info">
            <div class="info-group">
                <label>Address</label>
                <span>{{ account.address }}</span>
            </div>
            <div class="info-group">
                <label>Passport ID</label>
                <span>{{ account.passport_id }}</span>
            </div>
            <div class="info-group balance-group">
                <label>Balance</label>
                <span class="balance-amount">{{ account.balance }}</span>
            </div>
        </div>
        
        <div class="account-actions">
            <a href="{% url 'account-update' %}" class="btn btn-outline">Edit account details</a>
            <a href="{% url 'card-create' %}" class="btn btn-primary">Create a card</a>
        </div>
    </div>
{% endblock %}
